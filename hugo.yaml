# Hugo configuration file
title: crossvid

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Dev blog
      weight: 2
      pageRef: /blog
    - name: Team
      weight: 3
      pageRef: /team
    - name: Search
      weight: 4
      params:
        type: search
    - name: GitHub
      weight: 5
      url: "https://github.com/crossvid"
      params:
        icon: github

# Parse Git commit
enableGitInfo: true

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/crossvid/crossvid.github.io/edit/main/content"

  # from Git commit info
  displayUpdatedDate: true
  dateFormat: "January 2, 2006"
  displayUpdatedAuthor: true

  imageZoom:
    enable: true

  banner:
    key: 'announcement-000-wip'
    message: |
      🚧 **crossvid** is under construction 🚧

  externalLinkDecoration: true

outputs:
  home: [html, llms]
  page: [html]
  section: [html, rss]